name: build-geoip

on:
  push:
    branches: [main]
    paths: ['sets/**', 'scripts/**', '.github/workflows/build.yml']
  schedule:
    # 18:30 UTC = 02:30 Asia/Shanghai, before honk's 03:00 geodata pull window
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build geoip.dat
        run: |
          python3 scripts/build_geoip.py \
            --base https://raw.githubusercontent.com/Loyalsoldier/geoip/release/geoip-only-cn-private.dat \
            --out dist/geoip.dat
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: rebuild geoip.dat"
          git push
